(async function(){
 const root=document.getElementById('animol-fantasy-v6-preview');

 let last=null, paused=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 let elapsed=paused?2.50:0;
 let raf=null, state;
 try {
   const images=await AnimolBackgrounds.loadEmbedded(ASSETS);
   const renderer=AnimolBackgrounds.create(images,META,canvas);
   const refresh=()=>{state=renderer.render(elapsed,Number(theme.value));const name=META.themes[state.theme].name;if(status.textContent!==name)status.textContent=name;};
   const label=()=>{play.textContent=paused?'재생':'일시정지';play.setAttribute('aria-pressed',String(paused));};
   const frame=(now)=>{if(last!==null && !paused && !document.hidden)elapsed+=Math.min((now-last)/1000,0.10);last=now;refresh();raf=requestAnimationFrame(frame);};
   play.addEventListener('click',()=>{paused=!paused;label();});
   theme.addEventListener('change',()=>{elapsed=Math.floor(elapsed/5)*5+2.50;refresh();});
